[package]
name = "ssh-mcp"
version = "2.0.3"
edition = "2024"
authors = ["0FL01"]
description = "MCP server exposing SSH control for Linux systems via Model Context Protocol"
license = "MIT"
repository = "https://github.com/0FL01/ssh-mcp-rs"
homepage = "https://github.com/0FL01/ssh-mcp-rs#readme"
keywords = ["ssh", "mcp", "model-context-protocol", "server", "linux", "automation", "remote", "cli"]

[[bin]]
name = "ssh-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "0.13.0", features = ["server", "transport-io"] }

# SSH
russh = { version = "0.57", features = ["aws-lc-rs"] }

# Async runtime
tokio = { version = "1.49", features = ["full", "signal"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0.100"

# Serialization (for MCP)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.2"

# Crypto (read-ticket HMAC)
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

# Tracing/Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"

[dev-dependencies]
testcontainers = "0.26.3"
tempfile = "3.24"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[lints.clippy]
# Safety: Catch uninitialized memory assumptions
uninit_assumed_init = "deny"

# Safety: Catch other unsafe patterns
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# Качество кода и производительность
perf = { level = "warn", priority = -1 }
# Помогает избежать лишних аллокаций
manual_string_new = "deny"

# Code quality - set to lower priority so specific lints can override
all = { level = "warn", priority = -1 }
