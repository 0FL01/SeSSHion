[package]
name = "ssh-mcp-rs"
version = "4.1.1"
edition = "2024"
authors = ["0FL01"]
description = "SeSSHion: lightweight SSH MCP server for LLM agents"
license = "MIT"
repository = "https://github.com/0FL01/SeSSHion"
homepage = "https://github.com/0FL01/SeSSHion#readme"
readme = "README.md"
keywords = ["ssh", "mcp", "cli", "remote", "server"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "ssh_mcp"

[[bin]]
name = "ssh-mcp"
path = "src/main.rs"

[dependencies]
# MCP SDK
rmcp = { version = "=2.2.0", features = ["server", "transport-io"] }

# SSH
russh = { version = "=0.61.2", features = ["aws-lc-rs"] }

# Async runtime
tokio = { version = "1.49", features = ["full", "signal"] }
tokio-util = "0.7"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0.100"

# Serialization (for MCP)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.2"

# Text hashing
sha2 = "0.11"
getrandom = "0.4"

# Tracing/Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
testcontainers = "0.26.3"
tempfile = "3.24"
anyhow = "1.0.100"
nix = { version = "0.31", features = ["signal"] }
tokio = { version = "1.49", features = ["full", "signal", "process", "io-util", "sync", "time"] }
serde_json = "1.0.149"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[lints.clippy]
# Safety: Catch uninitialized memory assumptions
uninit_assumed_init = "deny"

# Safety: Catch other unsafe patterns
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# Качество кода и производительность
perf = { level = "warn", priority = -1 }
# Помогает избежать лишних аллокаций
manual_string_new = "deny"

# Code quality - set to lower priority so specific lints can override
all = { level = "warn", priority = -1 }
