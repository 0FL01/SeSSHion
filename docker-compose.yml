services:
  ssh:
    build:
      context: tests/fixtures/debian-sshd
    image: ssh-mcp-debian-sshd:latest
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      TEST_USER: test
      TEST_PASSWORD: test
    entrypoint: ["sh", "-c", "echo test:test | chpasswd && rm -f /home/test/.ssh/authorized_keys && exec /usr/sbin/sshd -D -e"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
